name: systech-demo
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.demo
    restart: unless-stopped
    environment:
      NODE_ENV: test
      SYSTECH_ISOLATED_TESTS: "true"
      PORT: "3103"
      APP_URL: http://127.0.0.1:5197
      CORS_ORIGINS: http://127.0.0.1:5197,http://localhost:5197
    ports:
      - "127.0.0.1:3103:3103"
    volumes:
      - demo_data:/data
      - type: bind
        source: ./.tools/docker-demo-seed/test.db
        target: /seed/test.db
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3103/api/health').then(async r=>{if(!r.ok||(await r.json()).database!=='connected')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5197:80"
    volumes:
      - type: bind
        source: ./.tools/product-ui-preview-verified-20261014
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - ./scripts/docker-demo-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  demo_data:
