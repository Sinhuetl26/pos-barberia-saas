# ======================================================================
# SYSTECH STUDIO - DOCKER COMPOSE ORCHESTRATION
# Development & Self-Hosting Stack (PostgreSQL 16 + Redis 7 + API)
# ======================================================================

version: '3.8'

services:
  # --- 1. PostgreSQL Database Service ---
  postgres:
    image: postgres:16-alpine
    container_name: systech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-systech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD es requerido en .env}
      POSTGRES_DB: ${POSTGRES_DB:-systech_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-systech} -d ${POSTGRES_DB:-systech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 2. Redis Message & Cache Queue ---
  redis:
    image: redis:7-alpine
    container_name: systech_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 3. SYSTECH Backend API Service ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: systech_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-systech}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-systech_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET es requerido en .env (minimo 32 caracteres)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-systech-refresh-secret-key-change-this-in-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,https://app.systech.mx}
      APP_URL: ${APP_URL:-http://localhost:5173}
      API_URL: ${API_URL:-http://localhost:3001/api}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      META_WA_PHONE_NUMBER_ID: ${META_WA_PHONE_NUMBER_ID:-}
      META_WA_ACCESS_TOKEN: ${META_WA_ACCESS_TOKEN:-}
      META_WA_VERIFY_TOKEN: ${META_WA_VERIFY_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "3001:3001"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
